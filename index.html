<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>ELEEME · Accesorios Premium Apple</title>
    <meta name="description" content="Accesorios originales y premium para el ecosistema Apple. Calidad verificada, entrega inmediata." />
    <link rel="canonical" href="https://eleeme-catalogo.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <!-- Un solo theme-color, sincronizado con el tema real del catálogo (no con
         el del sistema): el script de abajo y el botón del header lo actualizan. -->
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="apple-mobile-web-app-title" content="ELEEME" />

    <!-- Vista previa al compartir el catálogo por WhatsApp / Instagram -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ELEEME" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:url" content="https://eleeme-catalogo.vercel.app/" />
    <meta property="og:title" content="ELEEME · Accesorios Premium Apple" />
    <meta property="og:description" content="Accesorios originales y premium para el ecosistema Apple. Calidad verificada, entrega inmediata." />
    <meta property="og:image" content="https://eleeme-catalogo.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ELEEME · Accesorios para el ecosistema Apple" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ELEEME · Accesorios Premium Apple" />
    <meta name="twitter:description" content="Accesorios originales y premium para el ecosistema Apple. Calidad verificada, entrega inmediata." />
    <meta name="twitter:image" content="https://eleeme-catalogo.vercel.app/og-image.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!--
      Pinta el fondo correcto antes de que monte React. Sin esto, al entrar en
      modo oscuro se ve un flash claro mientras carga el JS.

      El catálogo abre en modo claro por defecto: sólo se pone oscuro si la
      persona lo eligió antes con el botón del header. Ya no se mira
      prefers-color-scheme, así que quien tiene el teléfono en oscuro igual ve
      la tienda clara la primera vez. Misma clave que usa App.jsx.
    -->
    <script>
      (function () {
        try {
          var dark = localStorage.getItem('eleeme_dark_mode') === 'true'
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#f5f5f7'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#000000' : '#f5f5f7')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
