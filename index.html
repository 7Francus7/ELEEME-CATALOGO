    <!--
      Pinta el fondo correcto antes de que monte React. Sin esto, en modo oscuro
      se ve un flash blanco mientras carga el JS. Misma clave que usa App.jsx.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eleeme_dark_mode')
          var dark = stored !== null
            ? stored === 'true'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.backgroundColor = dark ? '#000000' : '#f5f5f7'
        } catch (e) {}
      })()
    </script>
